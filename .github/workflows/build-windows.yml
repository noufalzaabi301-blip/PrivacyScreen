name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --collect-submodules privacy_screen --name PrivacyScreen main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyScreen-Windows
          path: dist/PrivacyScreen.exe
          retention-days: 90
